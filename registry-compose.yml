version: "3.8"

services:

  registry:
    image: registry:2
    container_name: private_registry
    ports:
      - "5001:5000"
    volumes:
      - registry_data:/var/lib/registry

  registry_ui:
    image: joxit/docker-registry-ui:main
    container_name: registry_ui
    environment:
      - REGISTRY_TITLE=POZOS Private Registry
      - NGINX_PROXY_PASS_URL=http://private_registry:5000
    ports:
      - "8082:80"
    depends_on:
      - registry

volumes:
  registry_data:
